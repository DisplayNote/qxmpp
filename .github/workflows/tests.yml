name: tests

on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    env:
      CONFIG: ${{ matrix.config }}
      QT_VERSION: ${{ matrix.qt_version }}
    strategy:
      fail-fast: false
      matrix:
        # Qt 5.x and 6.1 jobs disabled; Qt 6 matches DisplayNote's 6.8 builds.
        config: [full-debug]
        qt_version: ['6.8.*']
    steps:
      - name: Install sudo and a C compiler
        # build-essential: install-qt-action's Python may need to build py7zr's
        # native deps (inflate64, pybcj, pyppmd) from source when no wheel exists.
        run: apt update && apt install -qq -y sudo build-essential
      - uses: actions/checkout@v2
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.3.*'
          version: ${{ matrix.qt_version }}
          modules: ${{ (startsWith(matrix.qt_version, '6.') && 'qt5compat') || '' }}
          setup-python: true
      - name: Install extra packages
        run: tests/travis/install-build-depends-debian
      - name: Run tests
        run: tests/travis/build-and-test
      - uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  macos:
    runs-on: macos-latest
    env:
      CONFIG: ${{ matrix.config }}
      QT_VERSION: ${{ matrix.qt_version }}
    strategy:
      fail-fast: false
      matrix:
        # Qt 5.x jobs disabled; Qt 6 pinned to 6.8 (6.*.* resolved to releases aqt cannot install).
        config: [full-debug]
        qt_version: ['6.8.*']
    steps:
      - uses: actions/checkout@v2
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.3.*'
          version: ${{ matrix.qt_version }}
          modules: ${{ matrix.qt_version[0] == '6' && 'qt5compat' || '' }}
          # Homebrew's Python is externally managed (PEP 668); let the action provide its own.
          setup-python: true
      - name: Install extra packages
        run: tests/travis/install-build-depends-macos
      - name: Drop AGL from Qt's OpenGL wrapper
        # Qt 6.8.3 links "-framework AGL", which the current macOS SDK no longer
        # ships; fixed upstream in later Qt releases.
        run: |
          f="$QT_ROOT_DIR/lib/cmake/Qt6/FindWrapOpenGL.cmake"
          sed -i '' -e 's/\${__opengl_agl_fw_path}//g' -e 's/-framework AGL//g' "$f"
          grep -n AGL "$f" || true
      - name: Disable OS X firewall
        run: |
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
      - name: Run tests
        run: tests/travis/build-and-test
      - uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  windows:
    runs-on: windows-latest
    env:
      QT_VERSION: ${{ matrix.qt_version }}
    strategy:
      fail-fast: false
      matrix:
        # Qt 5.15.2 headers no longer build with the current MSVC STL (stdext::make_checked_array_iterator removed).
        qt_version: ['6.8.*']
    steps:
      - uses: actions/checkout@v3
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.3.*'
          version: ${{ matrix.qt_version }}
      - name: Run tests
        run: |
          ${env:PATH} += ";D:/a/qxmpp/qxmpp/src/Debug"
          cmake . && cmake --build .
          # ctest
          # ctest --rerun-failed --output-on-failure

  doxygen:
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    steps:
      - name: Install dependencies
        run: apt update && apt install -qq -y sudo git clang cmake qt6-base-dev doxygen graphviz
      - uses: actions/checkout@v3
      - name: Build doxygen documentation
        run: tests/travis/build-documentation

  xmllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: sudo apt update && sudo apt install -y libxml2-utils
      - run: xmllint --noout $(find . -type f -name *.xml)

  reuse:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: REUSE Compliance Check
      uses: fsfe/reuse-action@v6  # v1 predates REUSE.toml support

  cpp-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: file
          version: 15
          files-changed-only: false
          thread-comments: true
      - name: C++ Linter
        if: steps.linter.outputs.checks-failed > 0
        run: echo "Some files failed the linting checks!"
