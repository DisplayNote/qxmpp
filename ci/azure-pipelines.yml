trigger:
  tags:
    include:
      - '*'

pr:
  branches:
    include:
      - '*'
  paths:
    exclude:
      - doc
      - README.md
      - COPYING
      - LICENSES
  drafts: false

parameters:
  - name: androidArchitectures
    type: object
    default:
      - name: android_arm64_v8a
        abi: arm64-v8a
        conanArch: armv8
      - name: android_armv7
        abi: armeabi-v7a
        conanArch: armv7
      - name: android_x86_64
        abi: x86_64
        conanArch: x86_64

resources:
  repositories:
    - repository: ci
      type: github
      endpoint: "DisplayNote through PAT."
      name: DisplayNote/qt-conan-ci
      # 2.5.0 adds the tests + coverage stage (roadmap 2.23).
      ref: refs/tags/2.5.0
    # AI Security Roadmap 4.1 — shared dependency-scanning (OSV-Scanner + Grype)
    # templates. v1.1.0 adds the dependency scan; v1.1.2 is the current tag.
    - repository: dn-templates
      type: github
      endpoint: "DisplayNote through PAT."
      name: DisplayNote/dn-pipeline-templates
      ref: refs/tags/v1.1.2

variables:
  - group: montage-client-environment-variables
  - name: projectFile
    value: 'qxmpp/CMakeLists.txt'
  # BUILD_UNVERSIONED_LIBRARY keeps the install tree free of the
  # libQXmppQt6.dylib -> libQXmppQt6.4.dylib -> libQXmppQt6.1.6.1.dylib symlink
  # chain, which the CopyFiles task in common/build-unix.yml@ci cannot stage.
  # WITH_QCA=OFF keeps the build Qt-only: CMakeLists.txt turns QCA on whenever an
  # agent happens to have it installed, and the dependency scan below assumes
  # there is nothing but Qt to inventory.
  - name: cmakeCommonArgs
    value: '-DBUILD_SHARED=ON -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOCUMENTATION=OFF -DBUILD_UNVERSIONED_LIBRARY=ON -DWITH_QCA=OFF'

# Stage order: DependencyScan -> setup (VERSION) -> tests_coverage -> build
# stages -> deploy. Every dependency is explicit. (No SecretScan stage here.)
stages:
  # QXmpp is built here against Qt only (QCA, OMEMO and GStreamer stay off, see
  # cmakeCommonArgs); Qt is supplied by qt-conan-ci and scanned in the products
  # that ship it. There are no lockfiles or manifests for OSV-Scanner to read, so
  # allowNoPackages keeps that from failing the gate. The scan still catches any
  # Conan requirement added later.
  - template: dependency-scan-stage.yml@dn-templates
    parameters:
      allowNoPackages: true

  - template: common/setup.yml@ci
    parameters:
      dependsOn: [DependencyScan]

  # Roadmap 2.23 — QXmpp's own test suites (ctest, BUILD_TESTS=ON) under
  # OpenCppCoverage (Windows, Debug). Shared library, like the product build, so
  # every compiled line counts; its DLL is in the build's src directory.
  # blocking: false is audit mode: failing tests or coverage below target are
  # warnings and the builds still run; true makes them stop the builds and the
  # deploy.
  - template: windows-x86_64/coverage.yml@ci
    parameters:
      enabled: true
      blocking: false
      projectFile: ${{ variables.projectFile }}
      buildSystem: cmake
      cmakeGenerator: 'Ninja'
      testConfigArgs: '-DBUILD_SHARED=ON -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF -DBUILD_DOCUMENTATION=OFF -DWITH_QCA=OFF'
      ctest: true
      extraPathDirs: ['$(coverageBuildDir)\src']

  - stage: macos_x86_64
    dependsOn: [setup, tests_coverage]
    condition: succeeded()
    displayName: 'BUILD | macos_x86_64'
    jobs:
      - job: macos_x86_64
        condition: succeeded()
        variables:
          qt-version: '6.8.8'
          qt-artifact-name: 'qt-mac-desktop-6.8.8'
          qt-artifact-version: '1.0.0'
          xcode-version: '26.2'
          projectFile: ${{ variables.projectFile }}
          CONAN_USER_HOME: $(Pipeline.Workspace)
          vstsFeed: 'Montage/build-tools'
        strategy:
          matrix:
            mac:
              imageName: 'macos-15'
        pool:
          vmImage: $(imageName)
        steps:
          - checkout: self
            clean: true
            submodules: recursive
            persistCredentials: true

          - template: common/python.yml@ci

          - template: common/conan/config.yml@ci

          - template: common/xcode.yml@ci

          - template: common/qt.yml@ci

          # Every stage publishes into the same 'build-folder' artifact, so the
          # two macOS stages stage under Macos/<conan arch>/<build type> to keep
          # from overwriting each other. The arch level uses conan's own
          # settings.arch spelling ('x86_64', 'armv8') so conanfile.py can build
          # the path with no translation table - same convention as log4qt.
          - template: common/build-unix.yml@ci
            parameters:
              spec: macx-clang
              qtKit: macos
              platform: Macos/x86_64
              buildType: Debug
              buildSystem: cmake
              cmakeGenerator: Ninja
              args: >-
                $(cmakeCommonArgs)
                -DCMAKE_PREFIX_PATH=$(Build.BinariesDirectory)/Qt/$(qt-version)/macos
                -DCMAKE_OSX_ARCHITECTURES=x86_64

          - template: common/build-unix.yml@ci
            parameters:
              spec: macx-clang
              qtKit: macos
              platform: Macos/x86_64
              buildType: Release
              buildSystem: cmake
              cmakeGenerator: Ninja
              args: >-
                $(cmakeCommonArgs)
                -DCMAKE_PREFIX_PATH=$(Build.BinariesDirectory)/Qt/$(qt-version)/macos
                -DCMAKE_OSX_ARCHITECTURES=x86_64

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: $(Build.ArtifactStagingDirectory)
              artifactName: build-folder
            displayName: 'PUBLISH | Publish results'

  - stage: macos_arm64
    dependsOn: [setup, tests_coverage]
    condition: succeeded()
    displayName: 'BUILD | macos_arm64'
    jobs:
      - job: macos_arm64
        condition: succeeded()
        variables:
          qt-version: '6.8.8'
          qt-artifact-name: 'qt-mac-desktop-6.8.8'
          qt-artifact-version: '1.0.0'
          xcode-version: '26.2'
          projectFile: ${{ variables.projectFile }}
          CONAN_USER_HOME: $(Pipeline.Workspace)
          vstsFeed: 'Montage/build-tools'
        strategy:
          matrix:
            mac:
              imageName: 'macos-15'
        pool:
          vmImage: $(imageName)
        steps:
          - checkout: self
            clean: true
            submodules: recursive
            persistCredentials: true

          - template: common/python.yml@ci

          - template: common/conan/config.yml@ci

          - template: common/xcode.yml@ci

          - template: common/qt.yml@ci

          # macos-15 agents are Apple Silicon, so arm64 builds natively; the
          # qt-mac-desktop-6.8.8 kit is universal and serves both macOS stages.
          - template: common/build-unix.yml@ci
            parameters:
              spec: macx-clang
              qtKit: macos
              platform: Macos/armv8
              buildType: Debug
              buildSystem: cmake
              cmakeGenerator: Ninja
              args: >-
                $(cmakeCommonArgs)
                -DCMAKE_PREFIX_PATH=$(Build.BinariesDirectory)/Qt/$(qt-version)/macos
                -DCMAKE_OSX_ARCHITECTURES=arm64

          - template: common/build-unix.yml@ci
            parameters:
              spec: macx-clang
              qtKit: macos
              platform: Macos/armv8
              buildType: Release
              buildSystem: cmake
              cmakeGenerator: Ninja
              args: >-
                $(cmakeCommonArgs)
                -DCMAKE_PREFIX_PATH=$(Build.BinariesDirectory)/Qt/$(qt-version)/macos
                -DCMAKE_OSX_ARCHITECTURES=arm64

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: $(Build.ArtifactStagingDirectory)
              artifactName: build-folder
            displayName: 'PUBLISH | Publish results'

  - stage: ios_arm64
    dependsOn: [setup, tests_coverage]
    condition: succeeded()
    displayName: 'BUILD | ios_arm64'
    jobs:
      - job: ios_arm64
        condition: succeeded()
        variables:
          qt-version: '6.8.8'
          qt-artifact-name: 'qt-mac-ios-6.8.8'
          # 1.0.1 repackages the iOS kit so its CMake config files and its
          # libraries agree; 1.0.0 shipped *Targets-debug.cmake referencing
          # *_debug.a files it had stripped, which aborted find_package(Qt6)
          # for every CMAKE_BUILD_TYPE.
          qt-artifact-version: '1.0.1'
          xcode-version: '26.2'
          projectFile: ${{ variables.projectFile }}
          CONAN_USER_HOME: $(Pipeline.Workspace)
          vstsFeed: 'Montage/build-tools'
        strategy:
          matrix:
            mac:
              imageName: 'macos-15'
        pool:
          vmImage: $(imageName)
        steps:
          - checkout: self
            clean: true
            submodules: recursive
            persistCredentials: true

          - template: common/python.yml@ci

          - template: common/conan/config.yml@ci

          - template: common/xcode.yml@ci

          - template: common/qt.yml@ci

          # Both configurations are built, like log4qt and avcore: deploy-develop
          # packages a debug and a release conan package per profile, so a missing
          # iOS/Debug tree fails the deploy (conanfile.py raises rather than
          # publishing an empty package). A debug build does not need debug Qt
          # libraries - it compiles our own objects with debug info and links the
          # release Qt, which is what qmake already does for the other libraries.
          #
          # BUILD_SHARED=OFF (overriding cmakeCommonArgs) builds a static
          # libQXmppQt6.a, like the static Qt for iOS kit it links against. A
          # shared build ships libQXmppQt6.dylib, which the qmake-built apps link
          # by @rpath but never embed, so dyld kills them at launch.
          - template: common/build-unix.yml@ci
            parameters:
              spec: macx-ios-clang
              qtKit: macos
              platform: iOS
              buildType: Debug
              buildSystem: cmake
              cmakeGenerator: Ninja
              cmakeToolchainFile: '$(Build.BinariesDirectory)/Qt/$(qt-version)/ios/lib/cmake/Qt6/qt.toolchain.cmake'
              args: >-
                $(cmakeCommonArgs)
                -DBUILD_SHARED=OFF
                -DCMAKE_PREFIX_PATH=$(Build.BinariesDirectory)/Qt/$(qt-version)/ios
                -DQT_HOST_PATH=$(Build.BinariesDirectory)/Qt/$(qt-version)/macos
                -DCMAKE_OSX_ARCHITECTURES=arm64
                -DCMAKE_SYSTEM_NAME=iOS
                -DCMAKE_OSX_SYSROOT=iphoneos

          - template: common/build-unix.yml@ci
            parameters:
              spec: macx-ios-clang
              qtKit: macos
              platform: iOS
              buildType: Release
              buildSystem: cmake
              cmakeGenerator: Ninja
              cmakeToolchainFile: '$(Build.BinariesDirectory)/Qt/$(qt-version)/ios/lib/cmake/Qt6/qt.toolchain.cmake'
              args: >-
                $(cmakeCommonArgs)
                -DBUILD_SHARED=OFF
                -DCMAKE_PREFIX_PATH=$(Build.BinariesDirectory)/Qt/$(qt-version)/ios
                -DQT_HOST_PATH=$(Build.BinariesDirectory)/Qt/$(qt-version)/macos
                -DCMAKE_OSX_ARCHITECTURES=arm64
                -DCMAKE_SYSTEM_NAME=iOS
                -DCMAKE_OSX_SYSROOT=iphoneos

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: $(Build.ArtifactStagingDirectory)
              artifactName: build-folder
            displayName: 'PUBLISH | Publish results'

  - ${{ each arch in parameters.androidArchitectures }}:
    - stage: ${{ replace(arch.name, '-', '_') }}
      dependsOn: [setup, tests_coverage]
      condition: succeeded()
      displayName: 'BUILD | ${{ arch.name }}'
      jobs:
        - job: ${{ replace(arch.name, '-', '_') }}
          condition: succeeded()
          variables:
            qt-version: '6.8.8'
            qt-artifact-name: 'qt-linux-android-6.8.8'
            qt-artifact-version: '1.0.0'
            projectFile: ${{ variables.projectFile }}
            CONAN_USER_HOME: $(Pipeline.Workspace)
            vstsFeed: 'Montage/build-tools'
            architecture: ${{ arch.name }}
            androidAbi: ${{ arch.abi }}
          pool:
            name: agent-pool-ubuntu2204-vmss
          steps:
            - checkout: self
              clean: true
              submodules: recursive
              persistCredentials: true

            - template: common/python.yml@ci

            - template: common/conan/config.yml@ci

            - template: common/qt.yml@ci

            - template: common/ndk.yml@ci
              parameters:
                version: '28.2.13676358'

            # The three ABI stages run in parallel and publish into the same
            # 'build-folder' artifact, so a shared Android/<build type> folder
            # let the last upload win and shipped one ABI's libQXmppQt6.so in
            # every Android package. Stage under Android/<conan arch>/<build
            # type> instead, same convention as the macOS stages.
            - template: common/build-unix.yml@ci
              parameters:
                spec: android-clang
                qtKit: gcc_64
                platform: Android/${{ arch.conanArch }}
                buildType: Debug
                buildSystem: cmake
                cmakeToolchainFile: '$(Build.BinariesDirectory)/Qt/$(qt-version)/${{ variables.architecture }}/lib/cmake/Qt6/qt.toolchain.cmake'
                args: >-
                  $(cmakeCommonArgs)
                  -DCMAKE_PREFIX_PATH=$(Build.BinariesDirectory)/Qt/$(qt-version)/${{ variables.architecture }}
                  -DQT_HOST_PATH=$(Build.BinariesDirectory)/Qt/$(qt-version)/gcc_64
                  -DQT_ANDROID_ABI=$(androidAbi)
                  -DANDROID_ABI=$(androidAbi)
                  -DANDROID_PLATFORM=android-28

            - template: common/build-unix.yml@ci
              parameters:
                spec: android-clang
                qtKit: gcc_64
                platform: Android/${{ arch.conanArch }}
                buildType: Release
                buildSystem: cmake
                cmakeToolchainFile: '$(Build.BinariesDirectory)/Qt/$(qt-version)/${{ variables.architecture }}/lib/cmake/Qt6/qt.toolchain.cmake'
                args: >-
                  $(cmakeCommonArgs)
                  -DCMAKE_PREFIX_PATH=$(Build.BinariesDirectory)/Qt/$(qt-version)/${{ variables.architecture }}
                  -DQT_HOST_PATH=$(Build.BinariesDirectory)/Qt/$(qt-version)/gcc_64
                  -DQT_ANDROID_ABI=$(androidAbi)
                  -DANDROID_ABI=$(androidAbi)
                  -DANDROID_PLATFORM=android-28

            - task: PublishBuildArtifacts@1
              inputs:
                pathToPublish: $(Build.ArtifactStagingDirectory)
                artifactName: build-folder
              displayName: 'PUBLISH | Publish results'

  - template: windows-x86_64/build.yml@ci
    parameters:
      projectFile: ${{ variables.projectFile }}
      buildSystem: cmake
      cmakeArgsDebug: >-
        $(cmakeCommonArgs)
        -DCMAKE_PREFIX_PATH=$(Build.BinariesDirectory)/Qt/$(qt-version)/msvc2022_64
      cmakeArgsRelease: >-
        $(cmakeCommonArgs)
        -DCMAKE_PREFIX_PATH=$(Build.BinariesDirectory)/Qt/$(qt-version)/msvc2022_64
      dependsOn: [setup, tests_coverage]

  - template: common/deploy-develop.yml@ci
    parameters:
      conanfile: 'qxmpp/conanfile.py'
      packageName: 'qxmpp'
      stageDependencies: ['DependencyScan', 'setup', 'tests_coverage', 'windows_x86_64', 'macos_x86_64', 'macos_arm64', 'ios_arm64', 'android_arm64_v8a', 'android_armv7', 'android_x86_64']
      conanProfiles: ['msvc19.x86_64', 'macos.x86_64', 'macos.arm64', 'ios.arm64', 'android.arm64-v8a', 'android.armeabi-v7a', 'android.x86_64']
